# =============================================================================
# Bronze NATS Ingestion Job
# Ingestão via NATS
# =============================================================================

resources:
  jobs:
    bronze_nats_ingestion:
      name: "[${bundle.target}] Bronze NATS Ingestion"

      max_concurrent_runs: 1
      timeout_seconds: 0

      tasks:
        - task_key: nats_streaming_ingestion
          description: "Consome mensagens do NATS broker e grava na tabela Bronze"

          spark_python_task:
            python_file: ../app/src/scripts/bronze_ingestion.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--schema"
              - "${var.bronze_schema}"
              - "--table"
              - "market_orders_raw"
              - "--duration"
              - "86400"
              - "--buffer-size"
              - "1000"
              - "--flush-interval"
              - "30"

          environment_key: default

          timeout_seconds: 0
          max_retries: 0
          retry_on_timeout: false

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - "nats-py>=2.9.0"